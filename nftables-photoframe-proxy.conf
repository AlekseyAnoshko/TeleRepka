#!/usr/sbin/nft -f
#
# Редирект трафика фоторамок ESP32 PhotoFrame на перехватывающие порты
# Squid (transparent proxy, см. squid.conf) — без этих правил Squid ничего
# не увидит, трафик рамки пойдёт напрямую и будет заблокирован сетью
# университета, как и до всей этой настройки.
#
# ВАЖНО: правила, добавленные командой `nft add ...` вручную, живут
# только в памяти и ПРОПАДАЂТ при перезагрузке Repka Pi. Чтобы они
# применялись автоматически при каждом старте, используйте этот файл через
# systemd unit `nftables.service` (штатный в Debian) — см. инструкцию
# установки ниже.
#
# Установка (единожды):
#   sudo cp nftables-photoframe-proxy.conf /etc/nftables-photoframe-proxy.conf
#   sudo nft -f /etc/nftables-photoframe-proxy.conf     # применить сразу
#
#   Чтобы правила применялись при каждой загрузке — добавьте вызов этого
#   файла в конец /etc/nftables.conf (штатный, читается nftables.service
#   при старте системы):
#     echo 'include "/etc/nftables-photoframe-proxy.conf"' | sudo tee -a /etc/nftables.conf
#     sudo systemctl enable nftables
#
# Если появится вторая фоторамка — добавьте для неё аналогичные две строки
# `redirect` с её IP-адресом (см. config.json в TeleRepka).

table inet nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        ip saddr 10.42.0.101 tcp dport 80 redirect to :3129
        ip saddr 10.42.0.101 tcp dport 443 redirect to :3130
    }
}
