# /etc/squid/squid.conf
#
# Transparent proxy для фоторамок ESP32 PhotoFrame на Repka Pi.
#
# Задача: прошивка рамки не умеет настраиваться на HTTP-прокси, а сеть
# университета блокирует прямые исходящие TCP/80/443-соединения — пропускает
# трафик только через прокси 172.27.100.5:4444. Решение: Squid слушает в
# режиме intercept (без явной настройки клиента), nftables на Repka Pi
# перенаправляет трафик рамки на эти порты, а сам Squid прогоняет запросы
# дальше через cache_peer (университетский прокси).
#
# Установка:
#   sudo apt-get install -y squid-openssl
#   sudo mkdir -p /etc/squid/certs
#   sudo openssl req -new -newkey rsa:2048 -sha256 -days 3650 -nodes -x509 \
#     -keyout /etc/squid/certs/dummy.pem -out /etc/squid/certs/dummy.pem \
#     -subj "/CN=repka-transparent-proxy"
#   sudo chown -R proxy:proxy /etc/squid/certs
#   sudo cp squid.conf /etc/squid/squid.conf
#   sudo systemctl restart squid
#
# nftables-редирект (без него Squid ничего не увидит — трафик рамки пойдёт
# напрямую и будет заблокирован сетью университета, как и раньше):
#   sudo nft add table inet nat
#   sudo nft 'add chain inet nat prerouting { type nat hook prerouting priority -100; }'
#   sudo nft add rule inet nat prerouting ip saddr 10.42.0.101 tcp dport 80 redirect to :3129
#   sudo nft add rule inet nat prerouting ip saddr 10.42.0.101 tcp dport 443 redirect to :3130

acl localnet src 10.42.0.0/24

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 1025-65535

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager

# Разрешаем только клиентам подсети хотспота (фоторамкам), остальное — deny.
http_access allow localnet
http_access allow localhost
http_access deny all

# --- Перехватывающие порты (intercept) -----------------------------------
# Клиент (рамка) не знает, что её трафик перехватывается — nftables просто
# перенаправляет пакеты на эти порты без изменения заголовков запроса.
http_port 3129 intercept

# HTTPS: peek+splice — Squid подсматривает SNI из TLS-хендшейка (какой
# домен запрашивается), но НЕ расшифровывает и НЕ подменяет сертификат —
# просто прозрачно прокидывает TCP-туннель дальше. Это обязательно, потому что
# прошить кастомный CA-сертификат в ESP32 нельзя.
https_port 3130 intercept ssl-bump generate-host-certificates=on \
    dynamic_cert_mem_cache_size=4MB cert=/etc/squid/certs/dummy.pem

acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump splice all

# --- Маршрутизация через университетский прокси --------------------------
# Весь исходящий трафик (и HTTP, и распакованный HTTPS-туннель) уходит на
# 172.27.100.5:4444 как на "родителя последней инстанции" — именно так сеть
# университета пропускает трафик наружу.
cache_peer 172.27.100.5 parent 4444 0 no-query default
never_direct allow all

visible_hostname repka-transparent-proxy
via off
forwarded_for off

coredump_dir /var/spool/squid
refresh_pattern ^ftp:           1440    20%     10080
refresh_pattern ^gopher:        1440    0%      1440
refresh_pattern -i (/cgi-bin/|\?) 0     0%      0
refresh_pattern .                0     20%     4320
