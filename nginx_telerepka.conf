# /etc/nginx/sites-available/telerepka
#
# Единая точка входа для всех сервисов Lab Hub на Repka Pi.
# Всё, что раньше открывалось по отдельным TCP-портам (5000 — app.py,
# 5001 — slideshow_server.py), теперь живёт как страницы одного сайта
# по внутреннему имени telerepka-k207.istu.int.
#
# Установка:
#   sudo apt-get install -y nginx
#   sudo cp nginx_telerepka.conf /etc/nginx/sites-available/telerepka
#   sudo ln -s /etc/nginx/sites-available/telerepka /etc/nginx/sites-enabled/telerepka
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Резолвинг имени telerepka-k207.istu.int:
#   - на самой Repka Pi (для Chromium-kiosk) — строка в /etc/hosts:
#       127.0.0.1  telerepka-k207.istu.int
#   - для фоторамок и ноутбуков сотрудников в хотспоте (10.42.0.0/24) —
#     добавьте в /etc/NetworkManager/dnsmasq-shared.d/telerepka.conf строку:
#       address=/telerepka-k207.istu.int/10.42.0.1
#     и перезапустите NetworkManager (nmcli connection down/up на хотспоте).

# --- Порт 80: обычный HTTP, без редиректа на HTTPS -----------------------
# ВАЖНО: не делаем redirect 80 -> 443 глобально. Прошивка ESP32 PhotoFrame
# ходит за /slideshow.jpg по простому HTTP и не умеет обрабатывать редиректы
# на HTTPS с самоподписанным сертификатом — поэтому слайд-шоу отдаём именно
# здесь, на 80-м порту. Остальной сайт (для людей, в браузере) с этого же
# порта отправляем на HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name telerepka-k207.istu.int;

    # Слайд-шоу для фоторамок — оставляем на обычном HTTP
    location /slideshow.jpg {
        proxy_pass http://127.0.0.1:5000/slideshow.jpg;
        proxy_set_header Host $host;
    }

    # Всё остальное (страницы для людей) — на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Порт 443: HTTPS для главной страницы, /broadcast и Socket.IO -------
# HTTPS обязателен для getDisplayMedia()/getUserMedia() в браузере
# сотрудника — без него запрос доступа к экрану/камере будет заблокирован.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name telerepka-k207.istu.int;

    ssl_certificate     /etc/nginx/certs/telerepka.crt;
    ssl_certificate_key /etc/nginx/certs/telerepka.key;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Socket.IO (WebRTC-сигнализация, показания датчиков) требует
    # явного проксирования вебсокет-заголовков
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
